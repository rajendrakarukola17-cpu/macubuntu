name: macubuntu Security, Reliability & Hardware CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test & lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libglib2.0-bin dpkg-dev
          python3 -m pip install --upgrade pip pytest pytest-cov pytest-asyncio jsonschema defusedxml requests PyYAML numpy httpx filelock
          python3 -m pip install ruff mypy bandit pip-audit detect-secrets

      - name: "Security: ruff lint check (fail on violations)"
        run: |
          ruff check --select S,B,ASYNC --ignore S110 \
            features/celina/celina_pkg/approval.py \
            features/celina/celina_pkg/evidence.py \
            features/celina/celina_pkg/config.py \
            features/celina/celina_pkg/connectors/base.py \
            features/celina/celina_pkg/net_policy.py \
            features/celina/celina_pkg/tools.py \
            features/celina/celina_pkg/cli_bridge.py \
            features/celina/celina_pkg/broker_host.py \
            tools/provision-model-manifest.py

      - name: "Security: mypy --strict on critical modules (fail on violations)"
        run: |
          PYTHONPATH=features/celina mypy --strict --follow-imports=skip \
            features/celina/celina_pkg/approval.py \
            features/celina/celina_pkg/evidence.py \
            features/celina/celina_pkg/config.py \
            features/celina/celina_pkg/connectors/base.py \
            features/celina/celina_pkg/net_policy.py \
            features/celina/celina_pkg/tools.py \
            features/celina/celina_pkg/cli_bridge.py

      - name: "Security: bandit HIGH severity scan (fail on HIGH)"
        run: |
          bandit -r features/celina/celina_pkg -lll

      - name: "Security: pip-audit vulnerability scan (fail on vulns)"
        run: |
          pip-audit -r features/celina/requirements.txt -r tools/requirements-tier-b.txt

      - name: "Security: detect-secrets scan (fail on new secrets)"
        run: |
          detect-secrets scan --force . --baseline .secrets.baseline

      - name: "P1 Config integrity: whitespace + JSON Schema validation (fail-closed)"
        run: |
          python3 tools/validate_configs.py

      - name: "P1 Negative test: whitespace corruption must be rejected"
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib, tempfile
          p = pathlib.Path("/tmp/corrupt-config.json")
          p.write_text('{"tools ": {}}')
          r = subprocess.run(["python3", "tools/validate_configs.py", "--file", str(p)], capture_output=True, text=True)
          assert r.returncode != 0, "Whitespace corruption must be rejected with non-zero exit"
          print("PASS: whitespace corruption rejected")

      - name: "P1 Manifest integrity: recompute SHA-256, verify integrity block, assert copies identical"
        run: |
          python3 tools/manifest_integrity.py --verify

      - name: "P1 Version consistency: all version fields must match version.toml"
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open("version.toml", "rb") as f:
              v = tomllib.load(f)
          celina = v["celina"]["version"]
          manifest = v["manifest"]["version"]
          schema = v["schema"]["version"]

          # Manifest must agree
          m = json.loads(open("system/capabilities/celina-capabilities.json").read())
          assert m["celina_version"] == celina, f"manifest celina_version {m['celina_version']} != {celina}"
          assert m["manifest_version"] == manifest, f"manifest manifest_version {m['manifest_version']} != {manifest}"
          # Neural-schema must agree
          n = json.loads(open("features/celina/config/neural-schema.json").read())
          assert n["schema_version"] == schema, f"neural-schema schema_version {n['schema_version']} != {schema}"
          # Both manifest copies must agree
          m2 = json.loads(open("features/celina/config/celina-capabilities.json").read())
          assert m2["celina_version"] == celina, f"manifest B celina_version {m2['celina_version']} != {celina}"
          print(f"PASS: all version fields match version.toml (celina={celina}, manifest={manifest}, schema={schema})")
          PY

      - name: "P2 Privilege dropping: run_as_user uses target user, not root"
        run: |
          python3 -m pytest tests/test_privilege_dropping.py -v

      - name: Bash syntax check (bash -n) on all shell scripts
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck static analysis (warning severity)
        run: |
          find . -name '*.sh' -print0 | xargs -0 shellcheck -S error

      - name: Python syntax compilation (py_compile)
        run: |
          python3 -m compileall -q features/celina/celina_pkg features/celina/celina_hardware system/nautilus system/firefox tests

      - name: Validate JSON configuration schemas
        run: |
          for f in features/celina/config/*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Verify 100% 7-way tool parity across schema, handlers, config, disk policy, domains, risk map & capability manifest
        run: |
          TMP_H="$(mktemp -d)"
          HOME="$TMP_H" TARGET_HOME="$TMP_H" XDG_CONFIG_HOME="$TMP_H/.config" XDG_DATA_HOME="$TMP_H/.local/share" \
          python3 -c '
          import json, sys
          sys.path.insert(0, "features/celina")
          from celina_pkg import approval, config, tools
          disk = json.loads(open("features/celina/config/neural-schema.json").read())
          cap_disk = json.loads(open("system/capabilities/celina-capabilities.json").read())
          tp = disk["security_policy"]
          schema_names = {t["function"]["name"] for t in tools.TOOL_SCHEMAS}
          impl_names = set(tools._AUTO_TOOL_MAP) | set(tools._APPROVAL_TOOL_MAP) | {"run_skill", "autonomous_gui_task"}
          cfg_names = config.TIER1_AUTO_TOOLS | config.TIER2_APPROVAL_TOOLS
          disk_names = set(tp["tier1_auto_tools"]) | set(tp["tier2_approval_tools"])
          dom_names = {n for d in disk["tool_domains"].values() for n in d.get("tools", [])}
          risk_names = set(approval.TOOL_RISK_MAP.keys())
          cap_names = set(cap_disk.get("tools", {}).keys())
          assert schema_names == impl_names == cfg_names == disk_names == dom_names == risk_names == cap_names
          ndom = len(disk["tool_domains"])
          print(f"Verified 100% 7-way parity across {len(schema_names)} tools & {ndom} domains.")
          '
          rm -rf "$TMP_H"

      - name: "P4 D5: Zero unpinned remote references (fail on uvx/npx/pip without pinned version)"
        run: |
          UNPINNED=0
          # Check executable installer scripts (skip comments and dry-run echo messages)
          while IFS= read -r -d '' f; do
            clean_lines="$(grep -vE '^\s*(#|echo\s+")' "$f" 2>/dev/null || true)"
            if printf '%s\n' "$clean_lines" | grep -qEn 'uvx [a-zA-Z0-9_-]+("| )'; then
              echo "FAIL: $f has unpinned uvx reference"
              UNPINNED=1
            fi
            if printf '%s\n' "$clean_lines" | grep -qEn 'npx -y .*@latest'; then
              echo "FAIL: $f has npx -y @latest"
              UNPINNED=1
            fi
            if printf '%s\n' "$clean_lines" | grep -qEn 'pip install [a-zA-Z0-9_-]+($| )'; then
              echo "FAIL: $f has unpinned pip install"
              UNPINNED=1
            fi
            if printf '%s\n' "$clean_lines" | grep -qEn 'ollama pull [a-z0-9.:/-]+'; then
              echo "FAIL: $f has unpinned ollama pull"
              UNPINNED=1
            fi
          done < <(find install.sh uninstall.sh stages features/celina/install.sh tools -name '*.sh' -print0)
          test "$UNPINNED" -eq 0 || exit 1
          echo "PASS: zero unpinned remote references"

      - name: "P4 D6: Pin age enforcement (lockfile entries older than 180 days fail CI)"
        run: |
          python3 - <<'PY'
          import datetime
          from pathlib import Path
          
          lockfile = Path("system/download-locks.sha256")
          if not lockfile.is_file():
              print("SKIP: no lockfile found")
              raise SystemExit(0)
          
          today = datetime.date.today()
          stale = []
          for line in lockfile.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split("|")
              if len(parts) < 6:
                  continue
              entry_id, entry_type, url, ref, sha, date_str = parts[:6]
              try:
                  verified = datetime.date.fromisoformat(date_str.strip())
                  age_days = (today - verified).days
                  if age_days > 180:
                      stale.append(f"{entry_id} (verified {date_str}, {age_days} days old)")
              except ValueError:
                  stale.append(f"{entry_id} (invalid date: {date_str})")
          
          if stale:
              print("FAIL: stale lockfile entries (re-verify required):")
              for s in stale:
                  print(f"  - {s}")
              raise SystemExit(1)
          print(f"PASS: all lockfile entries within 180-day freshness window")
          PY

      - name: Run full security, reliability, dry-run, rollback & hardware test suite
        run: |
          PYTHONPATH=features/celina pytest -q -W ignore --cov=celina_pkg --cov-branch \
            --cov-report=json:coverage.json \
            --cov-report=html:coverage_html \
            tests/ tests/audit/unit/

      - name: "Verify coverage floors per security-critical module"
        run: |
          python3 - <<'PY'
          import json, sys
          with open("coverage.json", encoding="utf-8") as fh:
            cov = json.load(fh)
          floors = {
            "features/celina/celina_pkg/approval.py": 80,
            "features/celina/celina_pkg/evidence.py": 80,
            "features/celina/celina_pkg/config.py": 80,
            "features/celina/celina_pkg/connectors/base.py": 80,
            "features/celina/celina_pkg/net_policy.py": 80,
            "features/celina/celina_pkg/tools.py": 80,
            "features/celina/celina_pkg/cli_bridge.py": 80,
          }
          failed = []
          for mod, floor in floors.items():
            pct = cov.get("files", {}).get(mod, {}).get("summary", {}).get("percent_covered", 0)
            if pct < floor:
              failed.append(f"{mod}: {pct:.1f}% < {floor}% floor")
            else:
              print(f"OK {mod}: {pct:.1f}% >= {floor}%")
          if failed:
            print("FAIL: coverage floors not met:")
            for f in failed:
              print(f"  {f}")
            sys.exit(1)
          print("PASS: all coverage floors met")
          PY

      - name: Verify zero-side-effect dry-run across all profiles, uninstall & Tier B sandbox
        run: |
          for prof in default-8gb macos-only power-user; do
            TMP_HOME="$(mktemp -d)"
            HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" XDG_CONFIG_HOME="$TMP_HOME/.config" XDG_DATA_HOME="$TMP_HOME/.local/share" \
              bash ./install.sh --dry-run --profile "$prof"
            test -z "$(ls -A "$TMP_HOME")"
            rm -rf "$TMP_HOME"
          done
          for extra in "--top-panel hidden --animation-speed fast" "--model granite3.1-moe:1b --fail-fast" "--macos-cmd-keys --silent-boot" "--system-only" "--user-only" "--accessibility --replace-swap --upgrade"; do
            TMP_HOME="$(mktemp -d)"
            # shellcheck disable=SC2086
            HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" bash ./install.sh --dry-run $extra
            test -z "$(ls -A "$TMP_HOME")"
            rm -rf "$TMP_HOME"
          done
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" bash ./install.sh --doctor >/dev/null || true
          test -z "$(ls -A "$TMP_HOME")"
          rm -rf "$TMP_HOME"
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" LC_ALL=C.UTF-8 bash ./install.sh --locale >/dev/null
          test -z "$(ls -A "$TMP_HOME")"
          rm -rf "$TMP_HOME"
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" bash ./tools/enroll-mok.sh --dry-run >/dev/null
          test -z "$(ls -A "$TMP_HOME")"
          rm -rf "$TMP_HOME"
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" bash ./uninstall.sh --dry-run
          test -z "$(ls -A "$TMP_HOME")"
          rm -rf "$TMP_HOME"
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" TARGET_HOME="$TMP_HOME" bash ./tools/experimental-deep-stack.sh --dry-run --generate-test-keys
          test -z "$(ls -A "$TMP_HOME")"
          rm -rf "$TMP_HOME"

      - name: Validate GNOME Shell extension schema, eBPF/Compute probes & .deb packaging
        run: |
          glib-compile-schemas --strict --dry-run system/gnome/extensions/celina-island@macubuntu.org/schemas
          python3 -m json.tool system/gnome/extensions/celina-island@macubuntu.org/metadata.json >/dev/null
          bash ./tools/build-ebpf.sh --check
          bash ./tools/build-ebpf.sh --dry-run
          bash ./tools/detect-compute.sh --json >/dev/null
          TMP_OUT="$(mktemp -d)"
          bash ./tools/build-deb.sh --out "$TMP_OUT"
          dpkg-deb --info "$TMP_OUT"/macubuntu_*_all.deb
          dpkg-deb --contents "$TMP_OUT"/macubuntu_*_all.deb | grep -q "celina-island@macubuntu.org/schemas/gschemas.compiled"
          rm -rf "$TMP_OUT"
