# macubuntu Celina BPF LSM Focus Mode Policy Template
# Signed deployment path: /etc/celina/policy.signed (Ed25519 detached signature)
schema_version: "1.0"
policy_id: "celina-focus-lsm"
fail_mode: "open"  # Never break desktop connectivity when Focus Mode is inactive
signed_bundle_path: "/etc/celina/policy.signed"
signature_algorithm: "ed25519"

prometheus_metrics:
  total_blocks: "celina_ebpf_blocks_total"
  net_blocks: "celina_ebpf_net_blocks_total"

modes:
  off:
    enforce_lsm: false
    denied_cgroups: []
    allowed_cgroups: ["*"]

  work:
    enforce_lsm: true
    allowed_cgroups:
      - "app-gnome-code*.scope"
      - "app-gnome-org.gnome.Terminal*.scope"
      - "celina.service"
      - "celina-router.service"
      - "ollama.service"
    denied_cgroups:
      - "app-flatpak-com.discordapp.Discord*.scope"
      - "app-flatpak-com.valvesoftware.Steam*.scope"
      - "app-flatpak-org.telegram.desktop*.scope"

  coding:
    enforce_lsm: true
    allowed_cgroups:
      - "app-gnome-code*.scope"
      - "app-gnome-org.gnome.Terminal*.scope"
      - "celina.service"
      - "ollama.service"
    denied_cgroups:
      - "app-flatpak-com.discordapp.Discord*.scope"
      - "app-flatpak-com.valvesoftware.Steam*.scope"
      - "app-flatpak-com.slack.Slack*.scope"

  dnd:
    enforce_lsm: true
    allowed_cgroups:
      - "celina.service"
      - "ollama.service"
    denied_cgroups:
      - "app-flatpak-com.discordapp.Discord*.scope"
      - "app-flatpak-com.slack.Slack*.scope"
      - "app-flatpak-org.telegram.desktop*.scope"
