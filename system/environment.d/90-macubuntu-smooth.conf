# macubuntu Native Wayland & Low-Latency App Rendering Environment
# Loaded automatically by systemd user session (~/.config/environment.d/)
# Forces Electron (VS Code, Discord, Obsidian, Slack), Firefox, Qt & SDL onto native Wayland
# for zero XWayland overhead, razor-sharp fractional scaling, and 60-120Hz touchpad smoothness.
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
MOZ_DBUS_REMOTE=1
QT_QPA_PLATFORM=wayland;xcb
SDL_VIDEODRIVER=wayland,x11
