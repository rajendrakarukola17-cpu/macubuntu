# macubuntu Wi-Fi Zero-Jitter — disable beacon sleep ping spikes
# NetworkManager wifi.powersave values:
#   0 = use default (driver decides, often enables powersave)
#   1 = ignore (leave driver default — does NOT disable powersave!)
#   2 = disable (explicitly disables Wi-Fi power saving)
#   3 = enable
# We want to DISABLE powersave for zero-jitter → wifi.powersave=2

[connection]
wifi.powersave = 2
