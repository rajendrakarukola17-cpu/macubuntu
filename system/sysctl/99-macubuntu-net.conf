# macubuntu Last-Mile Network Stack — TCP BBR + fq (headless/CI safe)
# Applied only after probing modprobe tcp_bbr / sch_fq availability.

# Default queue discipline: Fair Queuing (pairs with BBR)
net.core.default_qdisc = fq

# Congestion control: BBR (Bottleneck Bandwidth and Round-trip propagation time)
net.ipv4.tcp_congestion_control = bbr

# TCP Fast Open (client + server)
net.ipv4.tcp_fastopen = 3

# Don't slow down after idle
net.ipv4.tcp_slow_start_after_idle = 0

# Limit unsent bytes in socket write path (reduces tail latency under load)
net.ipv4.tcp_notsent_lowat = 131072
