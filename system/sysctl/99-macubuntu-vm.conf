# Single authoritative ZRAM + VM + Network + I/O Smoothness profile for macubuntu (8GB+ RAM)

# --- Memory & ZRAM Smoothness ---
# High swappiness is optimal for ZRAM: compressing anonymous pages beats dropping hot file cache
vm.swappiness=150
# ZRAM is RAM-backed and has zero rotational seek penalty — disable swap readahead
vm.page-cluster=0
# Retain directory/inode caches longer for snappier Finder/Files & Spotlight feel
vm.vfs_cache_pressure=50
# Prevent kernel reclaim stalls during heavy memory allocation bursts (browsers + Ollama)
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125

# --- Bounded Background Disk Writeback (eliminates I/O micro-stutters on large copies/pulls) ---
# Fixed 64 MiB / 256 MiB caps beat percentage ratios across 8GB-32GB systems
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456

# --- Interactive Desktop Responsiveness & IDE/File Watchers ---
# Isolate interactive desktop apps from heavy background compilation/indexing bursts
kernel.sched_autogroup_enabled=1
# Prevent VS Code, Electron, Syncthing & Spotlight watcher exhaustion / CPU polling fallbacks
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024

# --- Low-Jitter Modern Networking (BBR + FQ for snappier browsing & streaming) ---
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
