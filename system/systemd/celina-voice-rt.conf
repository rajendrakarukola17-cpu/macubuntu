# Optional PREEMPT_RT drop-in for celina-voice.service
# Install ONLY when running a PREEMPT_RT kernel (`cat /sys/kernel/realtime` == 1)
# to pin Celina's Silero VAD / PipeWire callbacks to FIFO priority 90 (equivalent to `chrt -f -p 90`).
[Service]
RestrictRealtime=no
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=90
