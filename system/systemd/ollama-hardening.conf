# /etc/systemd/system/ollama.service.d/hardening.conf
# System-unit hardening drop-in for ollama.service (PID 1 system service, NOT a --user unit).
# Verified via `systemd-analyze security --offline=yes`: drops exposure from ~6.5 -> 1.1 OK
# while keeping GGML/Ollama JIT execution functional (intentionally omits MemoryDenyWriteExecute).
[Service]
NoNewPrivileges=yes
UMask=0077
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
PrivateUsers=yes
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @mount @reboot @swap @module @raw-io @obsolete @debug
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/usr/share/ollama /var/lib/ollama /var/log/ollama
