[Service]
# 8GB-friendly anti-thrash Ollama profile:
# - Unloads quickly after idle (45s) so 2-4GB returns immediately to browser/apps
# - Nice=10 + best-effort low I/O priority prevents disk 100% / desktop UI freezes
# - OOMScoreAdjust=300 + ManagedOOMMemoryPressure=kill: on 8GB laptops, if an
#   oversized 4B+ model causes ZRAM churn/PSI pressure, systemd-oomd/kernel
#   reaps Ollama cleanly (and systemd restarts it) instead of killing GNOME Shell!
# - Flash Attention + q8_0 KV-cache halves attention & KV RAM (use q4_0 for ultra-tight RAM)
# - Dedicated cgroup v2 slice (local-inference.slice) + hard MemoryHigh/MemoryMax ceiling
Slice=local-inference.slice
CPUQuota=250%
MemoryHigh=5G
MemoryMax=6G
MemorySwapMax=2G
Nice=10
OOMScoreAdjust=300
ManagedOOMMemoryPressure=kill
IOSchedulingClass=best-effort
IOSchedulingPriority=6
IOWeight=30
Environment="OLLAMA_KEEP_ALIVE=45s"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_QUEUE=8"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
