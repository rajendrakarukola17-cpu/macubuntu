# Optional systemd drop-in for maximum kernel + mount-namespace confinement
# (targets `systemd-analyze security` exposure score < 5.0).
#
# Ubuntu 24.04/26.04 Guardrail:
#   When `kernel.apparmor_restrict_unprivileged_userns=1` is enabled, mount/user
#   namespace directives (`ProtectSystem=strict`, `PrivateDevices=yes`,
#   `ProtectKernel*=yes`) inside `--user` units require an AppArmor userns profile
#   (otherwise systemd exits with status=226/NAMESPACE). Opt in ONLY after verifying
#   `systemd-run --user -p ProtectSystem=strict /bin/true` succeeds on your host.
#
# Note on MemoryDenyWriteExecute:
#   Python ctypes/libffi closures may need JIT pages; enable `MemoryDenyWriteExecute=yes`
#   only on pure-Python micro-daemons (e.g., celina-memory.service) after testing.
[Service]
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
StateDirectory=celina
ReadWritePaths=%h/.local/share/celina %h/.config/celina %h/.local/state/macubuntu
InaccessiblePaths=-%h/.ssh -%h/.gnupg -%h/.aws -%h/.kube
