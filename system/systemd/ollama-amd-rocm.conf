# Opt-in AMD ROCm GPU Offload drop-in for ollama.service (/etc/systemd/system/ollama.service.d/)
# Only deployed on verified discrete AMD ROCm GPUs (RDNA2/3); iGPUs default to Vulkan (ollama-amd-vulkan.conf).
# Adjust HSA_OVERRIDE_GFX_VERSION to match your exact RDNA target (e.g. 10.3.0 for RX 6000, 11.0.0 for RX 7000).
[Service]
Environment="HSA_OVERRIDE_GFX_VERSION=11.0.0"
Environment="ROCR_VISIBLE_DEVICES=0"
