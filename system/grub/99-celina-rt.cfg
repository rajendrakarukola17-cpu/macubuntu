# /etc/default/grub.d/99-celina-rt.cfg — Opt-in PREEMPT_RT deep C-state cap
# Disables deep CPU C-state wakeup spikes when measuring sub-10us jitter with cyclictest.
# Enable only on systems explicitly opting into ubuntu-realtime (increases idle battery draw).
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT processor.max_cstate=1 intel_idle.max_cstate=1"
