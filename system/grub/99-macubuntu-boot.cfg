# macubuntu — Opt-In Flicker-Free Boot & Active CPU P-State Tuning (--silent-boot)
# Deployed strictly to /etc/default/grub.d/99-macubuntu-boot.cfg (never modifies /etc/default/grub).
# Hold Shift or press Esc during boot to show the GRUB menu anytime.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} quiet splash loglevel=3 rd.systemd.show_status=auto vt.global_cursor_default=0 @CPU_PSTATE_ARG@"
