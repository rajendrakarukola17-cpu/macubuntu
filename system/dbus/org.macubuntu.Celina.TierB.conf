<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  macubuntu — Session D-Bus Isolation Policy for Experimental Tier B Sandbox
  Install path: /etc/dbus-1/session.d/org.macubuntu.Celina.TierB.conf

  Isolates any optional Tier B research daemon onto its own bus name
  (`org.macubuntu.Celina.TierB`) using modern Ubuntu 26.04 session-bus policy
  syntax (no deprecated at_console attribute) paired with peer-UID checks.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.macubuntu.Celina.TierB"/>
    <allow own="org.macubuntu.Celina.TierB"/>
    <allow send_destination="org.macubuntu.Celina.TierB"
           send_interface="org.macubuntu.Celina.TierB1"/>
  </policy>
</busconfig>
