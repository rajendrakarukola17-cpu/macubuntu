<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  macubuntu — Session D-Bus Policy for org.macubuntu.Celina
  Installed to: /etc/dbus-1/session.d/org.macubuntu.Celina.conf

  Defense-in-depth over the per-UID session bus socket ($XDG_RUNTIME_DIR/bus, 0600):
  uses modern Ubuntu 26.04 dbus-daemon/dbus-broker policy syntax (zero deprecated
  at_console attributes and zero invalid placeholder usernames), explicitly scoping
  allowed interfaces on the owning user's session bus while celina_pkg/dbus_service.py
  enforces peer-UID verification via org.freedesktop.DBus.GetConnectionUnixUser.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.macubuntu.Celina"/>
    <allow own="org.macubuntu.Celina"/>
    <allow send_destination="org.macubuntu.Celina"
           send_interface="org.macubuntu.Celina1"/>
    <allow send_destination="org.macubuntu.Celina"
           send_interface="org.macubuntu.Celina.Autonomy"/>
    <allow send_destination="org.macubuntu.Celina"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.macubuntu.Celina"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="org.macubuntu.Celina"
           receive_interface="org.macubuntu.Celina1"/>
    <allow receive_sender="org.macubuntu.Celina"
           receive_interface="org.macubuntu.Celina.Autonomy"/>
  </policy>
</busconfig>
