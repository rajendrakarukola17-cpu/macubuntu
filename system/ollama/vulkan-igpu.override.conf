# macubuntu — Low-Power Vulkan Offload Override (Intel Arc / Iris Xe / AMD RDNA3+ non-Strix-Halo)
# Install path: /etc/systemd/system/ollama.service.d/override.conf
#
# Note: Do NOT deploy on AMD Strix Halo (gfx1151) — use rocm-gfx1151.override.conf instead.
[Service]
Environment="OLLAMA_VULKAN=1"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
