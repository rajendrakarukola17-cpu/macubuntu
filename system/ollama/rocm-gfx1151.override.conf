# macubuntu — Stable AMD Strix Halo (gfx1151 / Radeon 8060S/8050S) ROCm Override
# Install path: /etc/systemd/system/ollama.service.d/override.conf
#
# CRITICAL: Do NOT set OLLAMA_VULKAN=1 on Strix Halo (gfx1151) — Vulkan hangs on
# Qwen3.5 models on gfx1151; ROCm with HSA_OVERRIDE_GFX_VERSION=11.5.1 is stable.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="HSA_OVERRIDE_GFX_VERSION=11.5.1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
