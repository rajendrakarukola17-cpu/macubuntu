<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- macubuntu — Retina / HiDPI font rendering (grayscale AA + hint=slight)
     Mirrors macOS subpixel-free grayscale antialiasing for crisp text on
     high-density displays. Deployed to /etc/fonts/conf.d/10-macubuntu-hidpi.conf
     behind ENABLE_HIDPI_FONTS in Stage 20 (appearance).
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!-- Prefer bitmap/scalable strikes at integer multiples for HiDPI crispness -->
  <match target="pattern">
    <edit name="dpi" mode="assign"><double>144</double></edit>
  </match>
</fontconfig>
