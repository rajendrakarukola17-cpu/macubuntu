# macubuntu — WirePlumber 0.5+ Pro-Audio Bluetooth & AirPods Codec Tuning
# Installed to ~/.config/wireplumber/wireplumber.conf.d/51-macubuntu-bluetooth.conf
# Enables native Apple AAC (AirPods/Beats), LDAC, aptX HD, SBC-XQ, wideband mSBC calls,
# hardware volume sync, and Bluetooth headphone battery reporting.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = "native"
  bluez5.codecs = [ aac ldac aptx_hd aptx sbc_xq sbc ]
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hsp_hs ]
}
