# macubuntu — Terminal-Aware Per-App Overrides for keyd-application-mapper
# Copy to ~/.config/keyd/app.conf and add your user to the `keyd` group if using
# keyd-application-mapper so Cmd+C / Cmd+V copy & paste cleanly inside terminals
# while physical Ctrl+C ALWAYS continues sending SIGINT!
# Universal fallback alternative for any terminal/TUI/TTY:
#   macos_cmd.c = C-insert  |  macos_cmd.v = S-insert  |  macos_cmd.x = S-delete

[org.gnome.Terminal]
macos_cmd.c = C-S-c
macos_cmd.v = C-S-v
macos_cmd.x = S-delete
macos_cmd.t = C-S-t
macos_cmd.w = C-S-w
macos_cmd.f = C-S-f

[org.gnome.Console]
macos_cmd.c = C-S-c
macos_cmd.v = C-S-v
macos_cmd.t = C-S-t
macos_cmd.w = C-S-w

[org.gnome.Ptyxis]
