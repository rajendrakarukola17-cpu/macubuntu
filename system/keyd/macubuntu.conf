# macubuntu — Terminal-Aware macOS Command Key Remapping (Wayland-native via keyd)
# Deployed ONLY when opted in via --macos-cmd-keys or ENABLE_MACOS_CMD_KEYS=true.
#
# Behavior:
#   - Physical Left Super / Meta acts as macOS Command (Cmd+C/V/X/A/Z/S/T/W/F/R/L/Q/Tab).
#   - Physical Left Ctrl remains untouched (Ctrl+C always sends SIGINT in terminals!).
#   - Pair with ~/.config/keyd/app.conf (keyd-application-mapper) for Ctrl+Shift+C/V in terminals.

[ids]
*

[main]
leftmeta = layer(macos_cmd)
rightmeta = layer(macos_cmd)
# Tap Caps Lock (<300ms) for Shift/modifier; hold (>=300ms) for Caps Lock (macOS-friendly timeout macro)
capslock = timeout(macro(leftshift), 300, capslock)

[macos_cmd:M]
c = C-c
v = C-v
x = C-x
a = C-a
z = C-z
s = C-s
t = C-t
w = C-w
f = C-f
r = C-r
l = C-l
n = C-n
p = C-p
q = A-f4
tab = A-tab
space = M-space
backspace = C-backspace
left = home
right = end
up = C-up
