# macubuntu — CoreAudio-Style Low-Jitter PipeWire Clock & Sample Rate Switching
# Installed to ~/.config/pipewire/pipewire.conf.d/99-macubuntu-audio.conf
# Prevents audio crackles during heavy browser/Ollama load while supporting 44.1/48/96 kHz media.
context.properties = {
  default.clock.rate          = 48000
  default.clock.allowed-rates = [ 44100 48000 96000 ]
  default.clock.quantum       = 512
  default.clock.min-quantum   = 128
  default.clock.max-quantum   = 2048
}
