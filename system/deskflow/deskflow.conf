# macubuntu Deskflow configuration — Universal Control over Wayland libei/TLS
# Encrypted cross-OS keyboard/mouse/clipboard KVM (successor to Synergy/Barrier)

[tls]
# TLS encryption enabled by default (Deskflow upstream default)
enabled = true
# Certificate paths (generated by deskflow-setup-tls.sh or user-provided)
cert_file = "${HOME}/.config/deskflow/cert.pem"
key_file = "${HOME}/.config/deskflow/key.pem"

[libei]
# Wayland libei input emulation (required for GNOME Wayland)
enabled = true
# Input capture portal name
portal_name = "macubuntu Deskflow Universal Control"

[server]
# Listen on localhost only (LAN access via UFW rules in Stage 40)
bind_address = "127.0.0.1"
bind_port = 24800

[clipboard]
# Shared clipboard across all connected machines
enabled = true
max_size_mb = 50

[screen]
# Edge-triggered screen switching
edge_trigger = true
screen_switch_delay_ms = 200
