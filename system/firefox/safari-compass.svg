<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Safari Compass Icon">
  <defs>
    <!-- Soft macOS outer squircle background -->
    <linearGradient id="squircleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7ecf4"/>
    </linearGradient>

    <!-- Vibrant macOS Safari compass face gradient -->
    <radialGradient id="dialGrad" cx="46%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#58d5ff"/>
      <stop offset="38%" stop-color="#1aa0ff"/>
      <stop offset="78%" stop-color="#0b6df0"/>
      <stop offset="100%" stop-color="#0647b8"/>
    </radialGradient>

    <!-- Subtle inner dial sheen -->
    <linearGradient id="dialSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#001b52" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Red-coral North compass needle facets -->
    <linearGradient id="needleRedLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e57"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <linearGradient id="needleRedDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e02e24"/>
      <stop offset="100%" stop-color="#b81d18"/>
    </linearGradient>

    <!-- Silver-white South compass needle facets -->
    <linearGradient id="needleWhiteLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="needleWhiteDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5deea"/>
      <stop offset="100%" stop-color="#b9c6d8"/>
    </linearGradient>

    <!-- Soft drop shadow for squircle & needle -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00102a" flood-opacity="0.22"/>
    </filter>
    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#001944" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#squircleBg)" filter="url(#cardShadow)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" ry="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>

  <!-- Blue Compass Dial -->
  <circle cx="256" cy="256" r="196" fill="url(#dialGrad)"/>
  <circle cx="256" cy="256" r="196" fill="url(#dialSheen)"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Compass Bezel Tick Marks (every 15 degrees: major + minor) -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- Major cardinal & 30-degree ticks -->
    <g stroke-width="4.5" stroke-opacity="0.92">
      <line x1="256" y1="74" x2="256" y2="104"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(30 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(60 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(90 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(120 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(150 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(180 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(210 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(240 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(270 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(300 256 256)"/>
      <line x1="256" y1="74" x2="256" y2="104" transform="rotate(330 256 256)"/>
    </g>
    <!-- Intermediate 15-degree ticks -->
    <g stroke-width="3" stroke-opacity="0.72">
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(15 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(45 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(75 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(105 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(135 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(165 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(195 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(225 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(255 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(285 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(315 256 256)"/>
      <line x1="256" y1="78" x2="256" y2="95" transform="rotate(345 256 256)"/>
    </g>
  </g>

  <!-- Beveled Safari Compass Needle rotated 45 degrees (pointing NE) -->
  <g transform="rotate(45 256 256)" filter="url(#needleShadow)">
    <!-- Red North half (left lit facet, right shaded facet) -->
    <polygon points="256,88 228,256 256,256" fill="url(#needleRedLight)"/>
    <polygon points="256,88 284,256 256,256" fill="url(#needleRedDark)"/>
    <!-- White South half (left lit facet, right shaded facet) -->
    <polygon points="256,424 228,256 256,256" fill="url(#needleWhiteLight)"/>
    <polygon points="256,424 284,256 256,256" fill="url(#needleWhiteDark)"/>
    <!-- Center Pivot Pin -->
    <circle cx="256" cy="256" r="10" fill="#f3f6fb" stroke="#b8c4d4" stroke-width="2"/>
  </g>
</svg>
