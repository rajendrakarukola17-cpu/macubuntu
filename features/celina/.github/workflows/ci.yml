name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af983 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed9c8f9e9899626106c74 # v5.1.1
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install lint tools
        run: pip install ruff bandit
      - name: Ruff check (F, E9, B)
        run: ruff check --select F,E9,B celina_pkg/ tools/
      - name: Ruff format check
        run: ruff format --check celina_pkg/ tools/
      - name: Bandit security scan
        run: bandit -c bandit.toml -r celina_pkg/ -q || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af983 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed9c8f9e9899626106c74 # v5.1.1
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Groups A+B tests
        run: python3 tools/test_critical_a_b.py
      - name: Run P0 regression tests
        run: python3 boost/update-20/pkg/tests/test_p0_regressions.py
      - name: Lazy import gate
        run: python3 tools/lint_lazy_imports.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af983 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed9c8f9e9899626106c74 # v5.1.1
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt -r requirements-optional.txt || true
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@22db9906219d55231b0c14a2293134f806522b12 # v2.1.9
        with:
          args: --verbose --report-format json --report-path gitleaks-report.json || true
      - name: Run CodeQL
        uses: github/codeql-action/init@3a49093b5939eb800a3ccb05590a0d73d7b2f749 # v3.27.0
        with:
          languages: python
      - uses: github/codeql-action/autobuild@3a49093b5939eb800a3ccb05590a0d73d7b2f749 # v3.27.0
      - uses: github/codeql-action/analyze@3a49093b5939eb800a3ccb05590a0d73d7b2f749 # v3.27.0

  release:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af983 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed9c8f9e9899626106c74 # v5.1.1
        with:
          python-version: "3.13"
      - name: Build .deb package
        run: |
          cd boost/update-20/pkg
          bash build-deb.sh || true
      - name: Generate SHA256SUMS
        run: |
          sha256sum *.deb > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@de230e63110050a67a7f931e996f8421f7c5f9d3 # v2.0.9
        with:
          files: |
            *.deb
            SHA256SUMS
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
